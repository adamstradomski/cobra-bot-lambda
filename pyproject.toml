[project]
name = "cobra-bot"
version = "0.1.0"
description = "Discord bot showing Cobra tournament pairings and standings, on AWS Lambda."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pynacl>=1.6.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
# Code blocks in docs are illustrative; keep their hand-aligned comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
# User-facing text uses the typographic en dash in scores and ranges ("3–0").
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared helpers: tests/builders.py
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "boto3>=1.43.108",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
