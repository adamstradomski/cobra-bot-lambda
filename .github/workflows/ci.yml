name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Installs Python 3.14 from .python-version and fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      # sam build needs python3.14 on PATH to install the Lambda dependencies.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Validate SAM template
        run: uvx --from aws-sam-cli==1.166.2 sam validate --lint
        env:
          SAM_CLI_TELEMETRY: "0"

      - name: Build Lambda package
        run: uvx --from aws-sam-cli==1.166.2 sam build
        env:
          SAM_CLI_TELEMETRY: "0"
